<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="swGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c0392b"/>
      <stop offset="40%" stop-color="#8B0000"/>
      <stop offset="100%" stop-color="#3d3e40"/>
    </linearGradient>
    <linearGradient id="rangGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d3e40"/>
      <stop offset="100%" stop-color="#555"/>
    </linearGradient>
  </defs>
  <!-- Star / compass mark on left -->
  <g transform="translate(30,52)">
    <!-- Compass star arms -->
    <line x1="0" y1="-22" x2="0" y2="22" stroke="#9aa0a6" stroke-width="1.5"/>
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#9aa0a6" stroke-width="1.5"/>
    <!-- Diamond tips -->
    <polygon points="0,-22 3,-14 0,-10 -3,-14" fill="#9aa0a6"/>
    <polygon points="0,22 3,14 0,10 -3,14" fill="#9aa0a6"/>
    <polygon points="-22,0 -14,-3 -10,0 -14,3" fill="#9aa0a6"/>
    <polygon points="22,0 14,-3 10,0 14,3" fill="#9aa0a6"/>
    <!-- Center circle -->
    <circle cx="0" cy="0" r="4" fill="none" stroke="#9aa0a6" stroke-width="1.2"/>
    <!-- Small accent dots -->
    <circle cx="-10" cy="-18" r="1.5" fill="#c0392b"/>
    <circle cx="-6" cy="-22" r="2" fill="#3d3e40" opacity="0.6"/>
    <circle cx="-14" cy="-15" r="1.2" fill="#c0392b"/>
    <circle cx="-3" cy="-26" r="1" fill="#9aa0a6"/>
  </g>
  <!-- "sw" in red gradient -->
  <text x="58" y="72" font-family="'Playfair Display', Georgia, serif" font-size="54" font-weight="900" font-style="italic" fill="url(#swGrad)">sw</text>
  <!-- "arang" in dark -->
  <text x="136" y="72" font-family="'Montserrat', Arial, sans-serif" font-size="54" font-weight="700" fill="#3d3e40">arang</text>
  <!-- Period dot -->
  <circle cx="500" cy="74" r="7" fill="#9aa0a6"/>
  <!-- Underline -->
  <line x1="136" y1="82" x2="493" y2="82" stroke="#3d3e40" stroke-width="2.5"/>
  <!-- Tagline -->
  <text x="136" y="100" font-family="'Montserrat', Arial, sans-serif" font-size="11" font-weight="500" fill="#3d3e40" letter-spacing="1">Culture. Community. Celebration.</text>
</svg>
