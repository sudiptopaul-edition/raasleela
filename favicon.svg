<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Definitions for gradients and drop shadows -->
  <defs>
    <!-- Premium Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9e7ad" />
      <stop offset="30%" stop-color="#edb929" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#edb929" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background (Dark Navy matching background deep) -->
  <circle cx="250" cy="250" r="240" fill="#0e0f19" stroke="url(#goldGrad)" stroke-width="4" />
  
  <!-- Inner Decorative Ring -->
  <circle cx="250" cy="250" r="225" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.8" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4" />

  <!-- Center Monogram "S" -->
  <text x="250" y="240" 
        font-family="'Playfair Display', 'Georgia', serif" 
        font-size="120" 
        font-weight="900" 
        font-style="italic"
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        dominant-baseline="central"
        filter="url(#goldGlow)">S</text>

  <!-- Circular Text Path for Wordmark -->
  <path id="textPathTop" d="M 70,250 A 180,180 0 1,1 430,250" fill="none" />
  <path id="textPathBottom" d="M 430,250 A 180,180 0 0,1 70,250" fill="none" />

  <!-- Organization & Location Wordmark -->
  <text font-family="'Montserrat', sans-serif" font-size="20" font-weight="600" fill="#f9e7ad" letter-spacing="8">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      SWARANG FOUNDATION
    </textPath>
  </text>
  
  <text font-family="'Montserrat', sans-serif" font-size="16" font-weight="500" fill="#edb929" letter-spacing="6">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      ESTD. 2026 • SILCHAR
    </textPath>
  </text>

  <!-- Small star dividers on the sides -->
  <g transform="translate(250,250) rotate(-10)">
    <path d="M -180,0 L -177,-3 L -174,0 L -177,3 Z" fill="url(#goldGrad)" />
  </g>
  <g transform="translate(250,250) rotate(190)">
    <path d="M -180,0 L -177,-3 L -174,0 L -177,3 Z" fill="url(#goldGrad)" />
  </g>
</svg>
